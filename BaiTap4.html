
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu CSS</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #333;
            text-align: center;
        }

        li {
            display: inline-block;
        }

        li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 18px;
        }

        li a:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>
</body>
</html>
