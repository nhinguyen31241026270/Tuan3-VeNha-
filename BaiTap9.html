
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu Font Awesome</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: white;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            background-color: #333;
            text-align: center;
        }

        li {
            display: inline-block;
        }

        li a {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 18px 30px;
            font-size: 18px;
        }

        li a i {
            margin-right: 8px;
            color: #00c9c9;
        }

        li a:hover {
            background-color: #555;
        }

        li a:hover i {
            color: yellow;
        }
    </style>
</head>

<body>
    <ul>
        <li>
            <a href="#">
                <i class="fa-solid fa-cart-shopping"></i>
                TMDT
            </a>
        </li>

        <li>
            <a href="#">
                <i class="fa-solid fa-database"></i>
                ERP
            </a>
        </li>

        <li>
            <a href="#">
                <i class="fa-solid fa-chart-line"></i>
                MIS
            </a>
        </li>

        <li>
            <a href="#">
                <i class="fa-solid fa-chart-pie"></i>
                DS
            </a>
        </li>
    </ul>
</body>
</html>
