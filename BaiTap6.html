
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MY PORTFOLIO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: white;
        }

        .portfolio {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .portfolio h2 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #333;
        }

        .portfolio h2::after {
            content: "";
            display: block;
            width: 60px;
            height: 2px;
            background-color: #5bc0be;
            margin: 15px auto;
        }

        .list-tab {
            list-style: none;
            padding: 0;
            margin: 25px 0;
        }

        .list-tab li {
            display: inline-block;
            margin: 0 10px;
        }

        .list-tab a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .list-tab a:hover,
        .list-tab li:first-child a {
            color: #5bc0be;
        }

        .galerry {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .galerry li img {
            width: 100%;
            display: block;
        }

        @media (max-width: 600px) {
            .galerry {
                grid-template-columns: 1fr;
            }
        }
        
    </style>
</head>

<body>
    <section class="portfolio">
